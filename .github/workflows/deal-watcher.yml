name: deal-watcher

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 min (GitHub may start it a few minutes late)
  workflow_dispatch:         # lets you run it by hand from the Actions tab

permissions:
  contents: write            # to save seen_products.json back to the repo

concurrency:
  group: deal-watcher
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Check for new deals
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PYTHONIOENCODING: utf-8
        run: python3 deal_watcher.py

      - name: Save what we've seen
        run: |
          git config user.name "deal-watcher-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen_products.json
          if ! git diff --cached --quiet; then
            git commit -m "Update seen products"
          elif [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt 4320000 ]; then
            # no commit for 50 days: keep the repo "active" so GitHub doesn't pause the schedule
            git commit --allow-empty -m "Keepalive"
          fi
          git push
